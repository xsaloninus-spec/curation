<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>TLV Mirror 1995.301 — render</title>
<style>html,body{margin:0;height:100%;background:#8a8a86}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from './GLTFLoader.js'

const params = new URLSearchParams(location.search)
const view = params.get('cam') ?? 'iso'

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(1)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.0
document.body.appendChild(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color('#8a8a86')
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 100000)

scene.add(new THREE.HemisphereLight('#ffffff', '#6a6a66', 0.9))
const key = new THREE.DirectionalLight('#fff4e0', 2.2)
key.position.set(300, 500, 400)
scene.add(key)
const fill = new THREE.DirectionalLight('#dfe8ff', 0.7)
fill.position.set(-400, 100, -300)
scene.add(fill)

const loader = new GLTFLoader()
loader.load('./model.glb', gltf => {
  const model = gltf.scene
  scene.add(model)
  model.updateMatrixWorld(true)
  const box = new THREE.Box3().setFromObject(model)
  const center = box.getCenter(new THREE.Vector3())
  const size = box.getSize(new THREE.Vector3())
  const radius = Math.max(size.y, size.z) / 2

  // 模型薄轴为 X：decorated back 朝向由视图枚举决定，先按 +X 为镜背渲染
  const views = {
    front: { pos: [-1, 0, 0], dist: 3.2, target: [0, 0, 0] },      // 镜面（平滑面）
    back:  { pos: [1, 0, 0], dist: 3.2, target: [0, 0, 0] },       // 镜背
    side:  { pos: [0, 0, 1], dist: 3.2, target: [0, 0, 0] },      // 侧视
    iso:   { pos: [1, 0.65, 0.85], dist: 3.4, target: [0, 0, 0] }, // 45°
    knob:  { pos: [1, 0.35, 0.4], dist: 1.1, target: [0, 0, 0] }, // 镜钮+方框
    tlv:   { pos: [1, 0.5, 0.85], dist: 1.5, target: [0, 0.28, 0.24] }, // TLV+四神象限
    band:  { pos: [1, 0.25, 0.95], dist: 1.5, target: [0, 0.3, 0.34] }, // 外缘纹带
  }
  const v = views[view] ?? views.iso
  const dir = new THREE.Vector3(...v.pos).normalize()
  const dist = radius * 2 * v.dist
  camera.position.copy(center).add(dir.multiplyScalar(dist)).add(new THREE.Vector3(...v.target).multiplyScalar(radius * 2))
  camera.lookAt(center.clone().add(new THREE.Vector3(...v.target).multiplyScalar(radius * 2)))
  camera.far = dist * 20
  camera.updateProjectionMatrix()
  renderer.render(scene, camera)
  window.__SCENE_READY__ = true
}, undefined, err => { window.__SCENE_ERROR__ = String(err) })
</script>
</body>
</html>
